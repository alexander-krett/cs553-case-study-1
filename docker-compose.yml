# Host ports are limited to 2100-2110 on the shared VM. Container ports stay
# standard: Gradio 7860, prometheus_client 8000, Node Exporter 9100.
# Both products run the same image; only api_product builds it.
x-app-common: &app-common
  image: ${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME in .env}/resumelens-cs3:${IMAGE_TAG:-v1}
  restart: unless-stopped
  networks: [resumelens]
  security_opt:
    - no-new-privileges:true

services:
  api_product:
    <<: *app-common
    build:
      context: .
    environment:
      PRODUCT_MODE: api
      ROOT_PATH: /api
      APP_VERSION: ${IMAGE_TAG:-v1}
      REMOTE_PRIMARY_MODEL: ${REMOTE_PRIMARY_MODEL:-openai/gpt-oss-20b}
      REMOTE_BACKUP_MODEL: ${REMOTE_BACKUP_MODEL:-zai-org/GLM-5.3-Flash}
      INFERENCE_TIMEOUT: ${INFERENCE_TIMEOUT:-300}
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${API_UI_PORT:-2101}:7860"
      - "${BIND_ADDRESS:-0.0.0.0}:${API_METRICS_PORT:-2105}:8000"
      - "${BIND_ADDRESS:-0.0.0.0}:${API_NODE_PORT:-2106}:9100"

  local_product:
    <<: *app-common
    environment:
      PRODUCT_MODE: local
      ROOT_PATH: /local
      APP_VERSION: ${IMAGE_TAG:-v1}
      LOCAL_PRIMARY_MODEL: ${LOCAL_PRIMARY_MODEL:-unsloth/Qwen3-0.6B-GGUF}
      LOCAL_PRIMARY_FILE: ${LOCAL_PRIMARY_FILE:-*Q4_K_M.gguf}
      LOCAL_BACKUP_MODEL: ${LOCAL_BACKUP_MODEL:-LiquidAI/LFM2.5-1.2B-Instruct-GGUF}
      LOCAL_BACKUP_FILE: ${LOCAL_BACKUP_FILE:-*QAD-Q4_0.gguf}
      LOCAL_CONTEXT_SIZE: ${LOCAL_CONTEXT_SIZE:-4096}
      # llama.cpp threads should match the CPU limit below.
      LOCAL_THREADS: ${LOCAL_CPUS:-2}
      HF_HOME: /home/resumelens/.cache/huggingface
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${LOCAL_UI_PORT:-2102}:7860"
      - "${BIND_ADDRESS:-0.0.0.0}:${LOCAL_METRICS_PORT:-2107}:8000"
      - "${BIND_ADDRESS:-0.0.0.0}:${LOCAL_NODE_PORT:-2108}:9100"
    volumes:
      - model_cache:/home/resumelens/.cache/huggingface
    # Shared-VM courtesy: cap the CPU model's footprint.
    mem_limit: ${LOCAL_MEM_LIMIT:-3g}
    cpus: ${LOCAL_CPUS:-2}

  prometheus:
    image: prom/prometheus:v3.13.2
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${PROMETHEUS_PORT:-2103}:9090"
    networks: [resumelens]
    depends_on:
      - api_product
      - local_product
    security_opt:
      - no-new-privileges:true

  grafana:
    image: grafana/grafana:13.2.5
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SERVER_ROOT_URL: ${PUBLIC_BASE_URL:-http://localhost:2100}/grafana/
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${GRAFANA_PORT:-2104}:3000"
    networks: [resumelens]
    depends_on:
      - prometheus
    security_opt:
      - no-new-privileges:true

  gateway:
    image: nginx:1.31.8-alpine3.24
    restart: unless-stopped
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./gateway/index.html:/usr/share/nginx/html/index.html:ro
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${PUBLIC_GATEWAY_PORT:-2100}:8080"
    networks: [resumelens]
    depends_on:
      - api_product
      - local_product
      - grafana
    security_opt:
      - no-new-privileges:true

  # Publishes the gateway (both products + Grafana) through one ngrok tunnel.
  # Without NGROK_AUTHTOKEN in .env it logs a message and exits cleanly.
  ngrok:
    image: ngrok/ngrok:3-alpine
    restart: on-failure
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
      NGROK_DOMAIN: ${NGROK_DOMAIN:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$NGROK_AUTHTOKEN" ]; then
          echo "ngrok disabled: NGROK_AUTHTOKEN not set"
          exit 0
        fi
        if [ -n "$$NGROK_DOMAIN" ]; then
          exec ngrok http gateway:8080 --log stdout --url "https://$$NGROK_DOMAIN"
        fi
        exec ngrok http gateway:8080 --log stdout
    ports:
      - "127.0.0.1:${NGROK_API_PORT:-2109}:4040"
    networks: [resumelens]
    depends_on:
      - gateway
    security_opt:
      - no-new-privileges:true

networks:
  resumelens:
    name: ${COMPOSE_PROJECT_NAME:?Set a unique COMPOSE_PROJECT_NAME}_network

volumes:
  model_cache:
  prometheus_data:
  grafana_data:
