[project]
name = "resumelens"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "gradio>=6.0,<7",
    "huggingface-hub>=1.0,<2",
    "prometheus-client>=0.21,<1",
    "python-dotenv>=1,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10"]
# CPU inference for PRODUCT_MODE=local: `uv sync --group local`.
local = ["torch==2.7.0", "transformers>=5,<6"]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
