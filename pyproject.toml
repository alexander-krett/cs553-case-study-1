[project]
name = "resumelens"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "gradio>=6.0,<7",
    "huggingface-hub>=1.0,<2",
    "prometheus-client>=0.21,<1",
    "python-dotenv>=1,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10"]
# Q4 GGUF inference for PRODUCT_MODE=local: `uv sync --group local`.
local = ["llama-cpp-python==0.3.36"]

[tool.uv]
package = false

[tool.uv.sources]
llama-cpp-python = { index = "llama-cpp-cpu" }

[[tool.uv.index]]
name = "llama-cpp-cpu"
url = "https://abetlen.github.io/llama-cpp-python/whl/cpu"
explicit = true
