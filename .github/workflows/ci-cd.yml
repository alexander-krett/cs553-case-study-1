name: Tests
on:
  push:
    branches: [local-deploy-main]
  pull_request:
    branches: [local-deploy-main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.16"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked python -m pytest -q
